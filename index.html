let temaAtual = "religiao";

function escolherTema(tema) {
    temaAtual = tema;
    document.getElementById("tema-atual").textContent = "Tema: " + banco[tema].titulo;
    document.querySelectorAll(".menu button").forEach(b => b.classList.remove("ativo"));
    event.target.classList.add("ativo");
    carregarConteudo();
    document.getElementById("resultado").innerHTML = "Clique em uma frase acima...";
}

function carregarConteudo() {
    const lista = document.getElementById("lista-conteudo");
    lista.innerHTML = "";
    banco[temaAtual].itens.forEach((item, indice) => {
        if (item.dica) {
            const div = document.createElement("div");
            div.style.padding = "10px";
            div.style.background = "#e8f4fd";
            div.style.borderRadius = "5px";
            div.style.margin = "5px 0";
            div.textContent = item.pt;
            lista.appendChild(div);
        } else if (item.palavra) {
            const div = document.createElement("div");
            div.className = "frase-pt";
            div.textContent = "📌 " + item.pt;
            div.onclick = () => {
                const parteIngles = item.pt.split("→")[1]?.trim() || "";
                document.getElementById("resultado").innerHTML = `
                <div class="opcao" onclick="falar('${parteIngles.replace(/'/g,"\\'").replace(/"/g,'\\"')}')">🔊 ${parteIngles}</div>
                <div class="explicacao">💡 Clique na palavra em inglês para ouvir a pronúncia!</div>`;
            };
            lista.appendChild(div);
        } else if (item.exercicio) {
            const div = document.createElement("div");
            div.className = "frase-pt";
            div.textContent = "✏️ " + item.pergunta;
            div.onclick = () => mostrarExercicio(item);
            lista.appendChild(div);
        } else {
            const div = document.createElement("div");
            div.className = "frase-pt";
            div.textContent = "📌 " + item.pt;
            div.onclick = () => mostrarResposta(indice);
            lista.appendChild(div);
        }
    });
}

function mostrarResposta(indice) {
    const item = banco[temaAtual].itens[indice];
    let html = "";
    item.opcoes.forEach(f => {
        const textoIngles = f.slice(3);
        html += `<div class="opcao" onclick="falar('${textoIngles.replace(/'/g,"\\'").replace(/"/g,'\\"')}')">${f}</div>`;
    });
    html += `<div class="explicacao">📌 Diferença entre elas:<br>${item.dif}</div>`;
    html += `<div class="pergunta">🔁 Para praticar: ${item.pratica}</div>`;
    html += `<div class="dica">💡 Clique na frase em inglês para ouvir a pronúncia!</div>`;
    document.getElementById("resultado").innerHTML = html;
}

function mostrarExercicio(item) {
    document.getElementById("resultado").innerHTML = `
    <div class="exercicio">
        <strong>❓ Pergunta:</strong> ${item.pergunta}<br><br>
        💡 <em>Dica: ${item.dica}</em><br><br>
        <button class="botao-mostrar" onclick="document.getElementById('resp${item.id}').style.display='block'; this.style.display='none'">👁️ Mostrar resposta</button>
        <div id="resp${item.id}" class="resposta-exercicio">${item.resposta}</div>
    </div>`;
}

function falar(texto) {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "en-US";
    voz.rate = 0.9;
    speechSynthesis.speak(voz);
}

escolherTema('religiao');
</script>
